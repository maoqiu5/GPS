<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brianhub GPS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    body { background: #f6f7f9; color: #18202a; }
    .app-shell { min-height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .app-shell.sidebar-collapsed { grid-template-columns: 58px minmax(0, 1fr); }
    .sidebar { padding: 14px; background: #111827; color: #fff; display: grid; align-content: start; gap: 12px; }
    .sidebar-toggle { width: 100%; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; padding: 8px 10px; font: inherit; cursor: pointer; }
    .brand { display: grid; gap: 4px; padding: 4px 2px 10px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .brand strong { font-size: 17px; }
    .brand span { font-size: 12px; color: rgba(255,255,255,.72); }
    .nav-btn { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; border: 1px solid #0f766e; border-radius: 8px; background: #0f766e; color: #fff; padding: 10px 11px; font: inherit; font-size: 14px; cursor: default; }
    .nav-icon { display: grid; place-items: center; width: 24px; height: 24px; color: #fff; font-size: 16px; }
    .nav-text { min-width: 0; }
    .nav-label { color: #fff; font-size: 14px; font-weight: 650; }
    .nav-hint { margin-top: 3px; color: rgba(255,255,255,.72); font-size: 12px; }
    .sidebar-collapsed .brand span, .sidebar-collapsed .brand strong, .sidebar-collapsed .nav-text { display: none; }
    .sidebar-collapsed .sidebar { padding: 12px 8px; }
    .sidebar-collapsed .nav-btn { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 10px 6px; }
    .sidebar-collapsed .sidebar-toggle { text-align: center; padding: 10px 6px; }
    .workspace { min-width: 0; display: grid; grid-template-columns: minmax(390px, 30vw) minmax(620px, 1fr); min-height: 100vh; }
    .control-pane { min-width: 0; padding: 10px 14px; display: grid; gap: 8px; align-content: start; background: #fff; border-right: 1px solid #d8dde5; overflow: auto; }
    .module-panel { display: none; gap: 8px; }
    .module-panel.active { display: grid; }
    .map-provider, .query-bar, .route-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid #d8dde5; border-radius: 8px; background: #f9fafb; }
    .route-panel { display: grid; gap: 7px; }
    .map-provider strong, .query-bar label { font-size: 13px; color: #4c5968; font-weight: 650; }
    .map-provider button, .query-bar button { height: 32px; border: 1px solid #1f2937; border-radius: 6px; background: #1f2937; color: #fff; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .map-provider button { height: 30px; border-color: #cfd6df; background: #fff; color: #18202a; padding: 0 10px; }
    .map-provider button[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; color: #fff; }
    .query-bar input, .query-bar select { height: 30px; min-width: 180px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 9px; font: inherit; font-size: 13px; background: #fff; }
    .query-bar button:disabled { opacity: .58; cursor: not-allowed; }
    .query-status { font-size: 13px; color: #4c5968; min-height: 1em; }
    .query-status.error { color: #b91c1c; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .topline { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .stats, .countries { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #4c5968; }
    .stats strong { color: #18202a; }
    .pill { display: inline-flex; gap: 5px; align-items: center; padding: 4px 8px; border: 1px solid #d8dde5; border-radius: 999px; background: #f9fafb; }
    .pill.removed { color: #991b1b; background: #fff1f2; border-color: #fecdd3; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .route-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .route-head strong { font-size: 14px; }
    .route-text { color: #18202a; font-size: 13px; overflow-wrap: anywhere; }
    .route-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 460px; font-size: 12px; }
    th, td { text-align: left; padding: 8px 7px; border-top: 1px solid #e1e5ea; white-space: nowrap; }
    th { color: #4c5968; font-weight: 650; }
    .map-pane { min-width: 0; min-height: 100vh; }
    #map { width: 100%; height: 100%; min-height: 420px; background: #e7edf3; }
    .legend, .removed-box { padding: 8px 10px; background: rgba(255,255,255,.96); border: 1px solid #cfd6df; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12); font-size: 13px; line-height: 1.35; }
    .removed-box { max-width: 360px; color: #4c5968; }
    .removed-box b { color: #991b1b; }
    .legend div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.24); flex: none; }
    .swatch.border { border-radius: 2px; background: #0891b2; transform: rotate(45deg); }
    .cn { background: #d7263d; } .kz { background: #2563eb; } .ru { background: #7c3aed; } .by { background: #059669; } .pl { background: #ea580c; }
    .start { background: #138a36; } .end { background: #111827; }
    .point-popup, .port-popup, .border-popup { min-width: 245px; max-width: 340px; }
    .point-popup h2, .port-popup h2, .border-popup h2 { margin: 0 0 6px; font-size: 15px; }
    .point-popup p, .port-popup p, .border-popup p { margin: 4px 0; font-size: 13px; }
    .geo-status { margin-top: 7px; padding-top: 7px; border-top: 1px solid #d8dde5; color: #4c5968; }
    .port-label { color: #7c2d12; background: rgba(255,255,255,.95); border: 1px solid #fed7aa; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .border-label { color: #155e75; background: rgba(255,255,255,.95); border: 1px solid #a5f3fc; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    @media (max-width: 760px) {
      .app-shell, .app-shell.sidebar-collapsed { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr 1fr; }
      .brand { grid-column: 1 / -1; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 1fr); }
      .control-pane { padding: 9px 11px; border-right: 0; border-bottom: 1px solid #d8dde5; max-height: 52vh; }
      .map-pane { min-height: 48vh; }
      .stats, .countries { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="模块导航">
      <div class="brand"><strong>Brianhub GPS</strong><span>实时轨迹与口岸识别</span></div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="折叠菜单" aria-expanded="true">☰</button>
      <button class="nav-btn" type="button" data-module="gps" aria-pressed="true" title="GPS轨迹"><span class="nav-icon" aria-hidden="true">⌖</span><span class="nav-text"><span class="nav-label">GPS轨迹</span><span class="nav-hint">设备号轨迹查询</span></span></button>
    </aside>
    <main class="workspace">
      <div class="control-pane">
        <section class="module-panel active" id="module-gps" aria-label="GPS轨迹查询" data-module="gps">
          <div class="map-provider" aria-label="地图底图">
            <strong>底图</strong>
            <button type="button" data-map-provider="esri-street" aria-pressed="true">街道</button>
            <button type="button" data-map-provider="esri-imagery" aria-pressed="false">卫星</button>
            <button type="button" data-map-provider="openstreetmap" aria-pressed="false">OSM</button>
            <button type="button" id="cache-map-tiles">缓存当前地图</button>
            <span class="query-status" id="tile-cache-status"></span>
          </div>
          <form class="query-bar" id="device-query-form">
            <label for="device-query-input">设备号</label>
            <input id="device-query-input" name="device_id" placeholder="输入设备号" autocomplete="off">
            <select id="device-quick-select" aria-label="选择设备"><option value="">加载设备列表...</option></select>
            <button id="device-query-button" type="submit">查询轨迹</button>
            <span class="query-status" id="query-status"></span>
          </form>
          <div class="topline">
            <h1>GPS 轨迹总览</h1>
            <div class="stats">
              <span>设备 <strong id="device">-</strong></span>
              <span>点位 <strong id="count">0 / 原始 0</strong></span>
              <span>剔除漂移 <strong id="removed-count">0</strong></span>
              <span>总时效 <strong id="total-duration">-</strong></span>
            </div>
          </div>
          <div class="stats">
            <span>最新位置：<strong id="latest-position">-</strong></span>
            <span>最新时间：<strong id="latest-time">-</strong></span>
          </div>
          <div class="countries" id="countries"></div>
          <section class="route-panel" aria-label="自动识别运输线路">
            <div class="route-head"><strong>自动识别运输线路</strong><span id="route-total">总时效 -</span></div>
            <div class="route-text" id="route-text">请选择设备查询轨迹。</div>
            <div class="route-table-wrap"><table><thead><tr><th>区段</th><th>发车</th><th>到达</th><th>运行</th><th>口岸等待</th></tr></thead><tbody id="route-segments"></tbody></table></div>
          </section>
        </section>
      </div>
      <div class="map-pane"><div id="map" role="img" aria-label="GPS轨迹地图"></div></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let points = [];
    let removedPoints = [];
    let ports = [];
    let borderCrossings = [];
    let route = { routeText: '', totalDuration: '-', segments: [] };
    let meta = { device: '', rawCount: 0, count: 0, removedCount: 0, countries: [], countryCounts: {}, totalDuration: '-' };
    let currentMap = null;
    let baseLayer = null;
    let mapProvider = 'esri-street';
    const SIDEBAR_STORAGE_KEY = 'gps.sidebarCollapsed';
    const apiBaseUrl = window.location.pathname.startsWith('/gps') ? '/gps' : 'http://127.0.0.1:8015';
    const colors = { CN: '#d7263d', KZ: '#2563eb', RU: '#7c3aed', BY: '#059669', PL: '#ea580c' };
    const cssCode = { CN: 'cn', KZ: 'kz', RU: 'ru', BY: 'by', PL: 'pl' };
    const mapProviders = {
      'esri-street': {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        options: { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
      },
      'esri-imagery': {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        options: { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
      },
      openstreetmap: {
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        options: { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors | reverse geocoding: Nominatim' }
      }
    };
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch])); }
    function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
    function formatTime(value) {
      if (!value) return '-';
      const text = String(value);
      return text.length >= 16 ? text.slice(0, 16) : text;
    }
    function formatCoord(value) {
      if (value == null || value === '') return '-';
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(6) : String(value);
    }
    function latestPoint() { return points.length ? points[points.length - 1] : null; }
    function popupHtml(p, extraHtml) {
      return `<div class="point-popup"><h2>原始第 ${escapeHtml(p.idx)} 个点</h2><p><b>所属国家：</b>${escapeHtml(p.country || '-')}</p><p><b>采集时间：</b>${escapeHtml(formatTime(p.time))}</p><p><b>经纬度：</b>${formatCoord(p.lon)}, ${formatCoord(p.lat)}</p><p><b>电量：</b>${p.battery == null ? '-' : escapeHtml(p.battery) + '%'}</p><p><b>速度：</b>${escapeHtml(p.speed || '-')}</p><div class="geo-status">${extraHtml || '点击后正在查询具体地理位置...'}</div></div>`;
    }
    function formatAddress(data) {
      if (!data) return '未查询到具体地址。';
      const a = data.address || {};
      const pieces = [a.country, a.state || a.province || a.region, a.county || a.city || a.town || a.village, a.suburb || a.neighbourhood, a.road || a.railway || a.hamlet].filter(Boolean);
      return `<b>具体位置：</b>${escapeHtml((pieces.length ? pieces.join(' / ') : data.display_name) || '未查询到具体地址')}<br><b>OSM 国家：</b>${escapeHtml(a.country || '-')}`;
    }
    async function enrichPopup(marker, p) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-CN&lat=${p.lat}&lon=${p.lon}&zoom=12&addressdetails=1`);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        marker.setPopupContent(popupHtml(p, formatAddress(await response.json())));
      } catch (_) {
        marker.setPopupContent(popupHtml(p, '具体位置查询失败，可放大地图查看附近地名。'));
      }
    }
    function initHeader() {
      const latest = latestPoint();
      setText('device', meta.device || '-');
      setText('count', `${meta.count || 0} / 原始 ${meta.rawCount || 0}`);
      setText('removed-count', meta.removedCount || 0);
      setText('total-duration', meta.totalDuration || '-');
      setText('latest-position', latest ? `${latest.country || '-'} ${formatCoord(latest.lon)}, ${formatCoord(latest.lat)}` : '-');
      setText('latest-time', latest ? formatTime(latest.time) : '-');
      const countries = Array.isArray(meta.countries) ? meta.countries : [];
      document.getElementById('countries').innerHTML = countries.map(name => {
        const p = points.find(item => item.country === name) || {};
        return `<span class="pill"><span class="dot ${cssCode[p.countryCode] || ''}"></span>${escapeHtml(name)} ${escapeHtml((meta.countryCounts || {})[name] || 0)} 点</span>`;
      }).join('') + `<span class="pill removed">已剔除 ${escapeHtml(meta.removedCount || 0)} 个漂移点</span>`;
      setText('route-total', `总时效 ${route.totalDuration || '-'}`);
      setText('route-text', route.routeText || '请选择设备查询轨迹。');
      document.getElementById('route-segments').innerHTML = (route.segments || []).map(seg => `<tr><td>${escapeHtml(seg.name)}</td><td>${escapeHtml(formatTime(seg.departTime))}</td><td>${escapeHtml(formatTime(seg.arrivalTime))}</td><td>${escapeHtml(seg.transportDuration)}</td><td>${escapeHtml(seg.portWait)}</td></tr>`).join('');
    }
    function setBaseLayer(map, providerName = mapProvider) {
      if (!map || typeof L === 'undefined') return;
      const provider = mapProviders[providerName] || mapProviders['esri-street'];
      mapProvider = mapProviders[providerName] ? providerName : 'esri-street';
      if (baseLayer && baseLayer._map) baseLayer._map.removeLayer(baseLayer);
      baseLayer = L.tileLayer(provider.url, provider.options).addTo(map);
      document.querySelectorAll('[data-map-provider]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mapProvider === mapProvider));
      });
    }
    function bindMapProviderControls() {
      document.querySelectorAll('[data-map-provider]').forEach(button => {
        button.addEventListener('click', () => {
          setBaseLayer(currentMap, button.dataset.mapProvider);
          setTimeout(() => currentMap && currentMap.invalidateSize(), 120);
        });
      });
    }
    function tileXY(lat, lon, zoom) {
      const scale = 2 ** zoom;
      const x = Math.floor((lon + 180) / 360 * scale);
      const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * scale);
      return { x, y };
    }
    function providerTileUrl(provider, z, x, y) {
      return provider.url.replace('{z}', z).replace('{x}', x).replace('{y}', y);
    }
    async function cacheCurrentMapTiles() {
      const status = document.getElementById('tile-cache-status');
      if (!currentMap || !mapProviders[mapProvider]) return;
      status.textContent = '正在缓存...';
      const bounds = currentMap.getBounds();
      const urls = [];
      const currentZoom = Math.round(currentMap.getZoom());
      for (const z of [currentZoom - 1, currentZoom, currentZoom + 1].filter(value => value >= 3 && value <= 12)) {
        const nw = tileXY(bounds.getNorth(), bounds.getWest(), z);
        const se = tileXY(bounds.getSouth(), bounds.getEast(), z);
        for (let x = Math.min(nw.x, se.x); x <= Math.max(nw.x, se.x); x++) {
          for (let y = Math.min(nw.y, se.y); y <= Math.max(nw.y, se.y); y++) {
            urls.push(providerTileUrl(mapProviders[mapProvider], z, x, y));
          }
        }
      }
      const limited = urls.slice(0, 90);
      await Promise.allSettled(limited.map(url => fetch(url, { mode: 'no-cors', cache: 'force-cache' })));
      status.textContent = `已缓存 ${limited.length} 张`;
    }
    function bindTileCacheControls() {
      const button = document.getElementById('cache-map-tiles');
      if (button) button.addEventListener('click', cacheCurrentMapTiles);
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        navigator.serviceWorker.register(`${window.location.pathname.replace(/\/[^/]*$/, '/') || '/gps/'}sw.js`).catch(() => {});
      }
    }
    function bindSidebarToggle() {
      const shell = document.querySelector('.app-shell');
      const toggle = document.getElementById('sidebar-toggle');
      const initialCollapsed = localStorage.getItem(SIDEBAR_STORAGE_KEY) === 'true';
      shell.classList.toggle('sidebar-collapsed', initialCollapsed);
      toggle.setAttribute('aria-expanded', String(!initialCollapsed));
      toggle.addEventListener('click', () => {
        const collapsed = shell.classList.toggle('sidebar-collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
        localStorage.setItem(SIDEBAR_STORAGE_KEY, String(collapsed));
        setTimeout(() => currentMap && currentMap.invalidateSize(), 180);
      });
    }
    function installGpsHistoryGuard() {
      if (!window.history || !window.history.replaceState || !window.history.pushState) return;
      const currentState = window.history.state || {};
      if (currentState.gpsHistoryGuard) return;
      const url = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      window.history.replaceState({ ...currentState, gpsApp: true, module: 'gps' }, '', url);
      window.history.pushState({ gpsHistoryGuard: true, module: 'gps' }, '', url);
      window.addEventListener('popstate', event => {
        if (event.state && event.state.gpsApp) {
          window.history.pushState({ gpsHistoryGuard: true, module: 'gps' }, '', url);
        }
      });
    }
    function applyTrajectoryData(data) {
      points = data.points || [];
      removedPoints = data.removedPoints || [];
      ports = data.ports || [];
      borderCrossings = data.borderCrossings || [];
      route = data.route || { routeText: '', totalDuration: '-', segments: [] };
      meta = data.meta || { device: '', rawCount: 0, count: 0, removedCount: 0, countries: [], countryCounts: {}, totalDuration: '-' };
      init();
    }
    async function queryDevice(deviceId) {
      const status = document.getElementById('query-status');
      const button = document.getElementById('device-query-button');
      const select = document.getElementById('device-quick-select');
      status.classList.remove('error');
      status.textContent = '正在查询数据库...';
      button.disabled = true;
      if (select) select.disabled = true;
      try {
        const url = `${apiBaseUrl}/api/trajectory?device_id=${encodeURIComponent(deviceId)}&limit=5000`;
        const response = await fetch(url);
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `HTTP ${response.status}`);
        }
        const data = await response.json();
        if (!data.points || data.points.length === 0) throw new Error('数据库没有查到该设备的轨迹点');
        applyTrajectoryData(data);
        document.getElementById('device-query-input').value = deviceId;
        if (select) select.value = deviceId;
        status.textContent = '';
      } catch (err) {
        status.classList.add('error');
        status.textContent = `查询失败：${err.message || err}。请确认 API 已启动在 ${apiBaseUrl}`;
      } finally {
        button.disabled = false;
        if (select) select.disabled = false;
      }
    }
    async function loadTrajectoryDevices() {
      const select = document.getElementById('device-quick-select');
      const status = document.getElementById('query-status');
      if (!select) return;
      try {
        const response = await fetch(`${apiBaseUrl}/api/trajectory-devices?limit=200`);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const devices = data.items || [];
        select.innerHTML = '<option value="">选择有轨迹设备...</option>' + devices.map(item => {
          const count = item.trackPointCount == null ? '-' : item.trackPointCount;
          const duration = item.totalDuration || '-';
          return `<option value="${escapeHtml(item.deviceId)}">${escapeHtml(item.deviceId)} · ${count}点 · ${escapeHtml(duration)}</option>`;
        }).join('');
        if (devices.length && status) status.textContent = '';
      } catch (_) {
        select.innerHTML = '<option value="">设备列表不可用</option>';
      }
    }
    function bindQueryForm() {
      const form = document.getElementById('device-query-form');
      const select = document.getElementById('device-quick-select');
      form.addEventListener('submit', event => {
        event.preventDefault();
        const deviceId = document.getElementById('device-query-input').value.trim();
        if (deviceId) queryDevice(deviceId);
      });
      select.addEventListener('change', event => {
        const deviceId = event.target.value;
        if (deviceId) queryDevice(deviceId);
      });
    }
    function markerLabel(name) { return escapeHtml(String(name || '').slice(0, 18)); }
    function renderEmptyMap() {
      if (currentMap) { currentMap.remove(); currentMap = null; }
      document.getElementById('map').innerHTML = '';
      if (typeof L === 'undefined') {
        document.getElementById('map').innerHTML = '<div style="padding:16px;color:#b91c1c;">地图脚本没有加载成功，请检查网络或刷新页面。</div>';
        return;
      }
      const map = L.map('map', { preferCanvas: true, scrollWheelZoom: true }).setView([48, 67], 3);
      currentMap = map;
      setBaseLayer(map);
      setTimeout(() => map.invalidateSize(), 200);
    }
    function init() {
      initHeader();
      if (!points.length) {
        renderEmptyMap();
        return;
      }
      if (currentMap) { currentMap.remove(); currentMap = null; }
      baseLayer = null;
      document.getElementById('map').innerHTML = '';
      if (typeof L === 'undefined') {
        document.getElementById('map').innerHTML = '<div style="padding:16px;color:#b91c1c;">地图脚本没有加载成功，请检查网络或刷新页面。</div>';
        return;
      }
      const canvasRenderer = L.canvas({ padding: 0.5 });
      const map = L.map('map', { preferCanvas: true, scrollWheelZoom: true, renderer: canvasRenderer });
      currentMap = map;
      setBaseLayer(map);
      const latlngs = points.filter(p => p.lat != null && p.lon != null).map(p => [p.lat, p.lon]);
      if (!latlngs.length) {
        renderEmptyMap();
        return;
      }
      L.polyline(latlngs, { renderer: canvasRenderer, color: '#111827', weight: 8, opacity: 0.34, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1];
        const cur = points[i];
        if (prev.lat == null || prev.lon == null || cur.lat == null || cur.lon == null) continue;
        L.polyline([[prev.lat, prev.lon], [cur.lat, cur.lon]], { renderer: canvasRenderer, color: colors[cur.countryCode] || '#1f6feb', weight: 5, opacity: 0.96, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      }
      points.forEach((p, i) => {
        if (p.lat == null || p.lon == null) return;
        const isStart = i === 0;
        const isEnd = i === points.length - 1;
        const marker = L.circleMarker([p.lat, p.lon], { renderer: canvasRenderer, radius: isStart || isEnd ? 7 : 4.5, color: isStart || isEnd ? '#111827' : '#ffffff', weight: isStart || isEnd ? 2.5 : 1.7, fillColor: isStart ? '#138a36' : isEnd ? '#111827' : (colors[p.countryCode] || '#1f6feb'), fillOpacity: 0.96 }).bindPopup(popupHtml(p, '点击点位后会查询具体地理位置。')).addTo(map);
        marker.on('click', () => enrichPopup(marker, p));
      });
      (ports || []).filter(item => item.lat != null && item.lon != null).forEach(port => {
        L.circle([port.lat, port.lon], { radius: Math.max(1, Number(port.radiusKm) || 20) * 1000, color: '#f97316', weight: 1.5, fillOpacity: 0.06 }).addTo(map);
        L.marker([port.lat, port.lon], { icon: L.divIcon({ className: 'port-label', html: markerLabel(port.shortName || port.name), iconAnchor: [-14, -14] }), interactive: false }).addTo(map);
      });
      const borderIcon = L.divIcon({ className: '', html: '<div style="width:18px;height:18px;background:#0891b2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(21,94,117,.85),0 3px 9px rgba(0,0,0,.25);transform:rotate(45deg);"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
      (borderCrossings || []).filter(item => item.lat != null && item.lon != null).forEach(border => {
        const name = border.matchedPortShortName || `${border.fromCountryCode || '-'}-${border.toCountryCode || '-'}`;
        const confidence = border.confidence == null ? '-' : Math.round(Number(border.confidence) * 100) + '%';
        L.marker([border.lat, border.lon], { icon: borderIcon, zIndexOffset: 1100 }).bindPopup(`<div class="border-popup"><h2>${escapeHtml(name)}</h2><p><b>穿越：</b>${escapeHtml(border.fromCountry || '-')} -> ${escapeHtml(border.toCountry || '-')}</p><p><b>时间：</b>${escapeHtml(formatTime(border.crossingTime))}</p><p><b>轨迹点：</b>${escapeHtml(border.fromPoint || '-')} -> ${escapeHtml(border.toPoint || '-')}</p><p><b>匹配口岸：</b>${escapeHtml(border.matchedPortShortName || border.matchedPortName || '疑似边境通道')}</p><p><b>口岸距离：</b>${border.matchedDistanceKm == null ? '-' : escapeHtml(border.matchedDistanceKm) + ' km'}</p><p><b>置信度：</b>${confidence}</p><p>${escapeHtml(border.note || '')}</p></div>`).addTo(map);
        L.marker([border.lat, border.lon], { icon: L.divIcon({ className: 'border-label', html: escapeHtml(name), iconAnchor: [-14, -14] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
      });
      map.fitBounds(L.latLngBounds(latlngs), { padding: [32, 32] });
      if (removedPoints.length) {
        const box = L.control({ position: 'topright' });
        box.onAdd = function() {
          const div = L.DomUtil.create('div', 'removed-box');
          const p = removedPoints[0];
          div.innerHTML = `<b>已剔除漂移点</b><br>原始第 ${escapeHtml(p.idx)} 点：${escapeHtml(formatTime(p.time))}<br>${formatCoord(p.lon)}, ${formatCoord(p.lat)}<br>前段 ${escapeHtml(p.prevSpeed)} km/h，后段 ${escapeHtml(p.nextSpeed)} km/h，绕行 ${escapeHtml(p.detourRatio)}x`;
          return div;
        };
        box.addTo(map);
      }
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<div><span class="swatch start"></span>起点</div><div><span class="swatch cn"></span>中国段</div><div><span class="swatch kz"></span>哈萨克斯坦段</div><div><span class="swatch ru"></span>俄罗斯段</div><div><span class="swatch by"></span>白俄罗斯段</div><div><span class="swatch pl"></span>波兰段</div><div><span class="swatch border"></span>自动边境</div><div><span class="swatch end"></span>终点</div>';
        return div;
      };
      legend.addTo(map);
      setTimeout(() => map.invalidateSize(), 200);
    }
    window.addEventListener('error', event => {
      const mapEl = document.getElementById('map');
      if (mapEl && !mapEl.classList.contains('leaflet-container')) {
        mapEl.innerHTML = '<div style="padding:16px;color:#b91c1c;">页面脚本错误：' + escapeHtml(event.message) + '</div>';
      }
    });
    bindQueryForm();
    bindSidebarToggle();
    installGpsHistoryGuard();
    bindMapProviderControls();
    bindTileCacheControls();
    loadTrajectoryDevices();
    init();
  </script>
</body>
</html>
